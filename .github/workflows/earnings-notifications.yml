name: S&P 500 earnings notifications

# Two weekday schedules (cron is UTC; times below assume US daylight saving):
#   12:00 UTC (07:00 CDT / 08:00 ET, pre-market) -> calendar digest email
#     + window file
#   14:00 UTC (09:00 CDT / 10:00 ET, options open) -> deep-analysis
#     trade-sheet email, run after the open so option quotes/spreads are
#     live, not stale. NOTE: when DST ends (November), both runs land one
#     hour earlier in Central time and 14:00 UTC is 09:00 ET — before the
#     09:30 ET options open; shift the crons +1h then.
# Manual dispatch runs both back to back (optionally as a dry run).

on:
  schedule:
    - cron: "0 12 * * 1-5"    # digest
    - cron: "0 14 * * 1-5"    # trade sheet
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not send email)"
        type: boolean
        default: false
      ignore_state:
        description: "Re-email the full window, even already-notified tickers"
        type: boolean
        default: false
      ticker_limit:
        description: "Limit number of tickers (0 = all)"
        default: "0"

jobs:
  notify:
    # The digest job: every trigger except the 14:00 trade-sheet cron.
    if: github.event_name != 'schedule' || github.event.schedule == '0 12 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the "already notified" state between runs so each earnings is
      # emailed only once. A unique key per run always saves a fresh entry;
      # restore-keys pulls the most recent previous state (rolling cache).
      - name: Restore notification state
        uses: actions/cache@v4
        with:
          path: state
          key: earnings-state-${{ github.run_id }}
          restore-keys: |
            earnings-state-

      # Persist the window hand-off so the 14:00 trade-sheet job can consume
      # the window this run computes without re-scanning 500 tickers.
      - name: Cache window hand-off
        uses: actions/cache@v4
        with:
          path: out
          key: earnings-window-${{ github.run_id }}
          restore-keys: |
            earnings-window-

      - name: Send earnings digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LEAD_DAYS: ${{ vars.LEAD_DAYS }}
          MIN_DAYS: ${{ vars.MIN_DAYS }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}
          # Repository variable acting as a kill switch: set DRY_RUN=true to
          # make every run (including scheduled ones) preview instead of send.
          # The workflow_dispatch checkbox below still forces a dry run too.
          DRY_RUN: ${{ vars.DRY_RUN }}
          # Set USE_STATE=false to email the full window on every run — the
          # same tickers get re-notified each time, and nothing is recorded.
          USE_STATE: ${{ vars.USE_STATE }}
          STATE_FILE: state/notified.json
          # Hand-off consumed by the trade-sheet job. Cached (see above) but
          # outside state/ so notification state and window data stay separate.
          WINDOW_FILE: out/window.json
          TICKER_LIMIT: ${{ github.event.inputs.ticker_limit }}
        run: |
          python -m earnings_notifier \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.ignore_state == 'true' && '--no-state' || '' }}

      # On manual dispatch, also run the trade sheet in the same job so a
      # single "Run workflow" tests the whole pipeline. Scheduled trade sheets
      # run in the dedicated 14:00 job below instead (live option quotes).
      # The pause lets Yahoo's rate limiting cool down after the 500-ticker
      # scan above — without it the earnings-history endpoint returns empties.
      - name: Send earnings trade sheet
        if: github.event_name == 'workflow_dispatch'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          WINDOW_FILE: out/window.json
          ANALYZER_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit }}
          # Schwab real-time market data (optional; Yahoo fallback when unset
          # or when the weekly token has lapsed — see scripts/schwab_auth.py).
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          sleep 60
          python -m earnings_analyzer \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Alert on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_alert.py

  trade_sheet:
    # The dedicated analyzer run at 14:00 UTC (10:00 ET DST), after options open.
    if: github.event_name == 'schedule' && github.event.schedule == '0 14 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reuse the window the 13:00 digest run computed. Restore-only: this
      # job never writes the window. If the cache misses (e.g. the morning
      # run failed), the analyzer recomputes the window itself (slow path).
      - name: Restore window hand-off
        uses: actions/cache/restore@v4
        with:
          path: out
          key: earnings-window-
          restore-keys: |
            earnings-window-

      # Persist the scorecard (suggestion log + graded outcomes). Shares the
      # rolling state cache with the digest job; notified.json rides along
      # unchanged.
      - name: Persist scorecard state
        uses: actions/cache@v4
        with:
          path: state
          key: earnings-state-${{ github.run_id }}
          restore-keys: |
            earnings-state-

      - name: Send earnings trade sheet
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LEAD_DAYS: ${{ vars.LEAD_DAYS }}
          MIN_DAYS: ${{ vars.MIN_DAYS }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          WINDOW_FILE: out/window.json
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: python -m earnings_analyzer

      - name: Alert on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_alert.py
