name: Ticket Monitor

# Watches Carlsbad Caverns tickets on recreation.gov. When tickets open up it
# emails via the repo's SMTP secrets, opens a GitHub issue, and marks the run
# failed (GitHub's own failure email is a fallback).
# NOTE: scheduled workflows only run from the default branch.

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub's minimum is every 5 minutes; runs may be delayed
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to watch (YYYY-MM-DD)"
        required: false
      simulate_error:
        description: "Test: pretend the recreation.gov request failed"
        type: boolean
        default: false
      fail_threshold:
        description: "Consecutive failures before emailing (default 6)"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ticket-monitor
  cancel-in-progress: false

env:
  TARGET_DATE: ${{ inputs.target_date || '2026-11-27' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check availability
        id: check
        continue-on-error: true
        env:
          SIMULATE_ERROR: ${{ inputs.simulate_error }}
        run: python3 ticket_monitor/check.py

      # A request error leaves `summary` empty. Count consecutive errors in an
      # issue and email once when the threshold is reached; close it on recovery.
      - name: Track request failures
        env:
          GH_TOKEN: ${{ github.token }}
          IS_ERROR: ${{ steps.check.outputs.summary == '' }}
          FAIL_THRESHOLD: ${{ inputs.fail_threshold || '6' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.TICKET_EMAIL_TO || secrets.EMAIL_TO }}
        run: bash ticket_monitor/track_failures.sh

      - name: Open issue if tickets are available
        if: steps.check.outputs.summary != '' && startsWith(steps.check.outputs.summary, 'TICKETS AVAILABLE')
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          title="Tickets available for ${TARGET_DATE}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "$SUMMARY"
          else
            echo "Issue already open; not duplicating."
          fi

      - name: Send alert email
        if: steps.check.outcome == 'failure' && startsWith(steps.check.outputs.summary, 'TICKETS AVAILABLE')
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Recipient: repo variable TICKET_EMAIL_TO if set, else the shared EMAIL_TO secret.
          EMAIL_TO: ${{ vars.TICKET_EMAIL_TO || secrets.EMAIL_TO }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: python3 ticket_monitor/send_email.py

      - name: Fail run to trigger email
        if: steps.check.outcome == 'failure' && startsWith(steps.check.outputs.summary, 'TICKETS AVAILABLE')
        run: |
          echo "${{ steps.check.outputs.summary }}"
          exit 1
