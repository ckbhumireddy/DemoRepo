name: Earnings paper trader

# Two weekday phases. PRIMARY trigger: an external scheduler (cron-job.org,
# timezone America/New_York) calls the workflow_dispatch API at exactly
#   10:10 ET -> phase=morning  (close due positions + daily plan email)
#   15:40 ET -> phase=entry    (open positions just before the close)
# so runs start within seconds of the target and track DST automatically.
# See "Paper trader triggers" in README.md for the setup.
#
# The crons below are only a FALLBACK if the external trigger fails.
# GitHub starts scheduled runs 55-75 minutes late on shared runners
# (observed consistently), which is exactly why the external trigger is
# primary. Double runs are harmless: position state dedupes trades, and a
# ledger marker keeps the daily plan email to one send per day. NOTE:
# cron is UTC — when DST ends (November), shift both crons +1h.

on:
  schedule:
    - cron: "0 13 * * 1-5"    # morning
    - cron: "30 18 * * 1-5"   # entry
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        options: [morning, entry]
        default: morning
      dry_run:
        description: "Preview only (do not trade or email)"
        type: boolean
        default: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Read-only view of the window hand-off the digest run wrote.
      - name: Restore window hand-off
        uses: actions/cache/restore@v4
        with:
          path: out
          key: earnings-window-
          restore-keys: |
            earnings-window-

      # Rolling state cache shared with the notifications workflow (caches
      # are repo-scoped): state/trader.json rides alongside notified.json
      # and scorecard.json. The day's crons are staggered, so each run
      # restores the previous run's snapshot and re-saves the whole dir.
      - name: Persist trader state
        uses: actions/cache@v4
        with:
          path: state
          key: earnings-state-${{ github.run_id }}
          restore-keys: |
            earnings-state-

      - name: Run trader
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          WINDOW_FILE: out/window.json
          # Schwab real-time market data (optional; Yahoo fallback when
          # unset or when the weekly token has lapsed).
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          python -m earnings_trader \
            --phase ${{ github.event_name == 'schedule'
                        && (github.event.schedule == '0 13 * * 1-5' && 'morning' || 'entry')
                        || inputs.phase }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Alert on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_alert.py
