name: Portfolio insights

# Two weekday modes. PRIMARY trigger: the external scheduler (cron-job.org,
# timezone America/New_York) calls the workflow_dispatch API at exactly
#   12:30 ET -> mode=midday  (alert email only when thresholds crossed)
#   16:35 ET -> mode=eod     (full insights email, after the close)
# so runs start within seconds and track DST automatically.
#
# The crons below are only a FALLBACK (GitHub starts scheduled runs 55-75
# minutes late on shared runners). Double runs are harmless: the EOD email
# sends once per day via a state marker, and midday alerts dedupe per
# (date, ticker, trigger). NOTE: cron is UTC — when DST ends (November),
# shift both crons +1h.
#
# The portfolio comes from the PORTFOLIO_JSON secret (see
# scripts/fidelity_to_portfolio.py); holdings never live in the repo.

on:
  schedule:
    - cron: "35 16 * * 1-5"   # midday fallback
    - cron: "40 20 * * 1-5"   # eod fallback
  workflow_dispatch:
    inputs:
      mode:
        description: "Which mode to run"
        type: choice
        options: [eod, midday]
        default: eod
      dry_run:
        description: "Preview only (do not email or write state)"
        type: boolean
        default: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Rolling state cache shared with the other workflows: insights.json
      # rides alongside notified.json / scorecard.json / trader.json.
      - name: Persist insights state
        uses: actions/cache@v4
        with:
          path: state
          key: earnings-state-${{ github.run_id }}
          restore-keys: |
            earnings-state-

      - name: Run insights
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          # Alert thresholds (optional repo variables; blank = defaults).
          INSIGHTS_MOVE_ALERT_PCT: ${{ vars.INSIGHTS_MOVE_ALERT_PCT }}
          INSIGHTS_MOVE_ALERT_DOLLARS: ${{ vars.INSIGHTS_MOVE_ALERT_DOLLARS }}
          INSIGHTS_PORTFOLIO_ALERT_PCT: ${{ vars.INSIGHTS_PORTFOLIO_ALERT_PCT }}
          INSIGHTS_PORTFOLIO_ALERT_DOLLARS: ${{ vars.INSIGHTS_PORTFOLIO_ALERT_DOLLARS }}
          # The holdings document (JSON) — see scripts/fidelity_to_portfolio.py.
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          # Schwab market data for quotes/history (optional; Yahoo fallback).
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN: ${{ secrets.SCHWAB_TOKEN }}
        run: |
          python -m portfolio_insights \
            --mode ${{ github.event_name == 'schedule'
                       && (github.event.schedule == '35 16 * * 1-5' && 'midday' || 'eod')
                       || inputs.mode }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Alert on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_alert.py
