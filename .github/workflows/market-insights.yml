name: Market insights (unusual volume)

# Daily scan emailed after the close, when the session's volume is final and
# no projection is needed. PRIMARY trigger: the external scheduler
# (cron-job.org, timezone America/New_York) calls the workflow_dispatch API
# at 16:30 ET.
#
# The cron below is only a FALLBACK (GitHub starts scheduled runs 55-75
# minutes late on shared runners). Double runs are harmless: a state marker
# keeps the email to one send per day. NOTE: cron is UTC — when DST ends
# (November), shift it +1h.
#
# Dispatching this mid-session also works: the scan projects the partial
# day from a typical intraday volume curve and says so in the email.

on:
  schedule:
    - cron: "45 20 * * 1-5"   # fallback; lands ~21:40-22:00 UTC (~17:40 ET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not email or write state)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Rolling state cache shared with the other workflows.
      - name: Persist scanner state
        uses: actions/cache@v4
        with:
          path: state
          key: earnings-state-${{ github.run_id }}
          restore-keys: |
            earnings-state-

      - name: Run scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}
          INSIGHTS_TOP_N: ${{ vars.INSIGHTS_TOP_N }}
          INSIGHTS_MIN_RVOL: ${{ vars.INSIGHTS_MIN_RVOL }}
          # TradeStation market data — required for the full S&P 500 sweep;
          # without it the scan degrades to portfolio + watchlist via Yahoo.
          TRADESTATION_CLIENT_ID: ${{ secrets.TRADESTATION_CLIENT_ID }}
          TRADESTATION_CLIENT_SECRET: ${{ secrets.TRADESTATION_CLIENT_SECRET }}
          TRADESTATION_TOKEN: ${{ secrets.TRADESTATION_TOKEN }}
        run: |
          python -m market_insights \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Alert on failure
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_alert.py
